<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Inbox Assistant</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <iframe id="app" title="Voice Inbox Assistant" allow="autoplay; microphone"></iframe>
    <div id="offline" hidden>
      <h1>Can't reach Voice Inbox Assistant</h1>
      <p>Tried <strong id="tried"></strong>.</p>
      <div id="start-hint">
        <p>To use this computer, start the app, then click Retry:</p>
        <pre>cd voice-inbox-assistant
npm.cmd run dev</pre>
      </div>
      <div class="actions">
        <button id="retry" type="button">Retry</button>
        <button id="options" type="button" class="secondary">Change server</button>
      </div>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
